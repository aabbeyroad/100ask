<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Self-Reflection Q&A</title>
  <style>
    :root {
      --bg: #faf8f5;
      --card: #ffffff;
      --primary: #6b705c;
      --primary-hover: #585c4a;
      --accent: #cb997e;
      --text: #3d3d3d;
      --text-light: #7a7a7a;
      --border: #e8e4df;
      --shadow: 0 2px 12px rgba(0,0,0,0.06);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 2rem;
    }

    header {
      text-align: center;
      padding: 2.5rem 1rem 1.5rem;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -0.02em;
    }

    header p {
      margin-top: 0.4rem;
      font-size: 0.9rem;
      color: var(--text-light);
    }

    .container {
      max-width: 560px;
      margin: 0 auto;
      padding: 0 1rem;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 0;
      margin-bottom: 1.5rem;
      border-bottom: 2px solid var(--border);
    }

    .tab-btn {
      flex: 1;
      padding: 0.75rem;
      border: none;
      background: none;
      font-size: 0.95rem;
      color: var(--text-light);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: all 0.2s;
    }

    .tab-btn.active {
      color: var(--primary);
      font-weight: 600;
      border-bottom-color: var(--accent);
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Card */
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 2rem 1.5rem;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .date-badge {
      display: inline-block;
      font-size: 0.8rem;
      color: var(--text-light);
      background: var(--bg);
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      margin-bottom: 1rem;
    }

    .category-badge {
      display: inline-block;
      font-size: 0.75rem;
      color: white;
      background: var(--accent);
      padding: 0.2rem 0.6rem;
      border-radius: 12px;
      margin-bottom: 0.75rem;
    }

    .question-text {
      font-size: 1.2rem;
      font-weight: 600;
      line-height: 1.6;
      color: var(--text);
      margin-bottom: 1.5rem;
    }

    textarea {
      width: 100%;
      min-height: 150px;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      font-size: 1rem;
      font-family: inherit;
      line-height: 1.6;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s;
    }

    textarea:focus {
      border-color: var(--accent);
    }

    textarea::placeholder {
      color: #bbb;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 0.85rem;
      margin-top: 1rem;
      border: none;
      border-radius: 12px;
      background: var(--primary);
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover { background: var(--primary-hover); }
    .btn:disabled { background: #ccc; cursor: default; }

    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--primary);
      color: white;
      padding: 0.75rem 1.5rem;
      border-radius: 12px;
      font-size: 0.9rem;
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 100;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* History */
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .history-card {
      background: var(--card);
      border-radius: 12px;
      padding: 1.25rem;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    .history-date {
      font-size: 0.8rem;
      color: var(--text-light);
      margin-bottom: 0.5rem;
    }

    .history-question {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 0.5rem;
      line-height: 1.5;
    }

    .history-answer {
      font-size: 0.9rem;
      line-height: 1.6;
      color: var(--text);
      white-space: pre-wrap;
    }

    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-light);
    }

    .empty-state p {
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Daily Self-Reflection</h1>
    <p>for busy parents</p>
  </header>

  <div class="container">
    <div class="tabs">
      <button class="tab-btn active" data-tab="today">Today's Question</button>
      <button class="tab-btn" data-tab="history">History</button>
    </div>

    <!-- Today Tab -->
    <div id="today" class="tab-content active">
      <div class="card">
        <span class="date-badge" id="today-date"></span>
        <br />
        <span class="category-badge" id="today-category"></span>
        <p class="question-text" id="today-question">Loading...</p>
        <textarea id="answer-input" placeholder="here, write your thoughts..."></textarea>
        <button class="btn" id="save-btn" onclick="submitAnswer()">Save</button>
      </div>
    </div>

    <!-- History Tab -->
    <div id="history" class="tab-content">
      <div class="history-list" id="history-list">
        <div class="empty-state"><p>Loading...</p></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const API = "";

    // --- Tabs ---
    document.querySelectorAll(".tab-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));
        document.querySelectorAll(".tab-content").forEach((c) => c.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById(btn.dataset.tab).classList.add("active");
        if (btn.dataset.tab === "history") loadHistory();
      });
    });

    // --- Toast ---
    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 2000);
    }

    // --- Today ---
    let todayData = null;

    async function loadToday() {
      try {
        const res = await fetch(`${API}/api/today`);
        todayData = await res.json();

        document.getElementById("today-date").textContent = todayData.date;
        document.getElementById("today-category").textContent = todayData.question.category;
        document.getElementById("today-question").textContent = todayData.question.question;

        if (todayData.existing_answer) {
          document.getElementById("answer-input").value = todayData.existing_answer.answer;
          document.getElementById("save-btn").textContent = "Update";
        }
      } catch (e) {
        document.getElementById("today-question").textContent =
          "Failed to load the question. Please try again later.";
      }
    }

    async function submitAnswer() {
      const answer = document.getElementById("answer-input").value.trim();
      if (!answer) {
        showToast("Please enter your answer.");
        return;
      }

      const btn = document.getElementById("save-btn");
      btn.disabled = true;

      try {
        const res = await fetch(`${API}/api/answer`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            question_id: todayData.question.id,
            question_text: todayData.question.question,
            answer: answer,
          }),
        });
        const data = await res.json();
        if (res.ok) {
          showToast(data.message);
          btn.textContent = "Update";
        } else {
          showToast(data.detail || "Error occurred.");
        }
      } catch (e) {
        showToast("Network error. Please try again.");
      } finally {
        btn.disabled = false;
      }
    }

    // --- History ---
    async function loadHistory() {
      const list = document.getElementById("history-list");
      try {
        const res = await fetch(`${API}/api/history`);
        const data = await res.json();

        if (data.length === 0) {
          list.innerHTML = `<div class="empty-state"><p>No reflections yet.<br/>Start with today's question!</p></div>`;
          return;
        }

        list.innerHTML = data
          .map(
            (a) => `
          <div class="history-card">
            <div class="history-date">${a.date}</div>
            <div class="history-question">${escapeHtml(a.question_text)}</div>
            <div class="history-answer">${escapeHtml(a.answer)}</div>
          </div>`
          )
          .join("");
      } catch (e) {
        list.innerHTML = `<div class="empty-state"><p>Failed to load history.</p></div>`;
      }
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    // Init
    loadToday();
  </script>
</body>
</html>
